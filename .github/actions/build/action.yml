name: Build action
description: Install dependencies and build the bundled GitHub Action

inputs:
  verify-dist:
    description: Fail when rebuilding changes committed distribution files
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Type-check source
      shell: bash
      run: pnpm typecheck

    - name: Build action
      shell: bash
      run: pnpm build

    - name: Verify committed distribution
      if: inputs.verify-dist == 'true'
      shell: bash
      run: |
        changes="$(git status --porcelain --untracked-files=all -- dist)"
        if [[ -n "$changes" ]]; then
          echo "Rebuilding changed committed distribution files:"
          echo "$changes"
          exit 1
        fi
