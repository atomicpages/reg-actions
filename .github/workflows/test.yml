name: CI

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Job-scoped sakimori (v0.34+). Starts an eBPF daemon attached
      # to the runner-worker's cgroup BEFORE checkout, so every
      # subsequent step (checkout, pnpm/action-setup, the build, the
      # `./dist` action under test, the comment action) is observed
      # by a single supervisor. Earlier we used the one-step form
      # `bokuweb/sakimori@v0` with `run:`, which only supervised the
      # wrapped command and explicitly left `./dist` outside the
      # supervised tree.
      - uses: bokuweb/sakimori/job@8491d10e50cf65e438bedb87cd6f4e496140ac29 # v0.34.4
        with:
          policy: .github/sakimori.yml
          mode: block
          log: sakimori.log.json
          html: sakimori-report.html

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # version omitted: reads packageManager from package.json (pnpm@10.14.0)
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: pnpm i + package
        run: |
          pnpm i --frozen-lockfile
          pnpm package

      - uses: ./dist
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          image-directory-path: "./images"
          disable-branch: true
          report-file-path: './report.html'

      # Flush the daemon so upload-artifact + the comment sub-action
      # below see the freshly-written log + HTML. The daemon's own
      # post-hook would otherwise write them at end-of-job, too late
      # for an in-job upload.
      - if: always()
        uses: bokuweb/sakimori/job/stop@8491d10e50cf65e438bedb87cd6f4e496140ac29 # v0.34.4

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sakimori-report
          path: |
            sakimori-report.html
            sakimori.log.json
          if-no-files-found: ignore

      - uses: bokuweb/sakimori/comment@8491d10e50cf65e438bedb87cd6f4e496140ac29 # v0.34.4
        if: github.event_name == 'pull_request'
        with:
          log: sakimori.log.json
          artifact-name: sakimori-report
          html-filename: sakimori-report.html
