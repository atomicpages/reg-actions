name: CI (target hash)

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-target-hash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Job-scoped sakimori (v0.34+). See test.yml for the full
      # rationale. Earlier we used the one-step form which only
      # supervised the wrapped `pnpm i + pnpm build` block; this
      # widens supervision to every step including the github-script
      # randomiser and the `./dist` action under test.
      - uses: bokuweb/sakimori/job@8491d10e50cf65e438bedb87cd6f4e496140ac29 # v0.34.4
        with:
          version: v0.34.4
          policy: .github/sakimori.yml
          mode: block
          log: sakimori.log.json
          html: sakimori-report.html

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          verify-dist: "true"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: target
        with:
          result-encoding: string
          script: |
            return (Math.random() > 0.5) ? "59b7802" : "34f93ed"
      - uses: ./
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          image-directory-path: "./images"
          target-hash: "${{ steps.target.outputs.result }}"
          disable-branch: true
          comment-mode: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'never' || 'always' }}

      - if: always()
        uses: bokuweb/sakimori/job/stop@8491d10e50cf65e438bedb87cd6f4e496140ac29 # v0.34.4

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sakimori-target-hash-report
          path: |
            sakimori-report.html
            sakimori.log.json
          if-no-files-found: ignore

      - uses: bokuweb/sakimori/comment@8491d10e50cf65e438bedb87cd6f4e496140ac29 # v0.34.4
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        with:
          log: sakimori.log.json
          artifact-name: sakimori-target-hash-report
          html-filename: sakimori-report.html
