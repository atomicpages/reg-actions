name: "reg-actions"
author: "bokuweb"
description: 'A visual regression test tool for github actions.'
branding:
  icon: 'aperture'
  color: 'red'
inputs:
  github-token:
    description: 'GitHub API access token. It is used to upload test report and add comment to pull request.'
    default: ${{ github.token }}
  image-directory-path:
    description: "Path to images directory. The images stored in this directory will be compared with the expected images from the last upload."
    required: true
  enable-antialias:
    description: "Enable antialias."
    required: false
    default: 'false'
  matching-threshold:
    description: "Matching threshold, ranges from 0 to 1. Smaller values make the comparison more sensitive."
    required: false
    default: '0'
  threshold-rate:
    description: "The rate threshold at which the image is considered changed. When the difference ratio of the image is larger than the set rate detects the change. Applied after `matchingThreshold`."
    required: false
    default: '0'
  threshold-pixel:
    description: "The pixel threshold at which the image is considered changed. When the difference pixel of the image is larger than the set pixel detects the change. This value takes precedence over `thresholdRate`. Applied after `matchingThreshold`. If omitted, pixel threshold is not applied."
    required: false
  target-hash:
    description: "The commit hash to be compared."
    required: false
  artifact-name:
    description: 'Workflow artifact name.'
    required: false
    default: 'reg'
  branch:
    description: 'A branch name which manages images.'
    required: false
    default: 'reg_actions'
  disable-branch:
    description: 'The option to disable push to a branch. When set to true, the `branch` option is ignored, and images will not be displayed in the comments.'
    required: false
    default: 'false'
  custom-report-page:
    description: "The custom report page link."
    required: false
  report-file-path:
    description: "Path of the generated report html file. This file can be deployed in other Actions steps, but is not included in the artifact."
    required: false
    default: './report.html'
  comment-report-format:
    description: "The option how to render changed file in comment."
    required: false
    default: 'raw'
  outdated-comment-action:
    description: "The option to handle outdated comments. Options: 'none', 'minimize' (collapse old comments), 'update' (edit existing comment in place - sticky comment)."
    required: false
    default: 'none'
  comment-mode:
    description: "When to post PR comments. Options: 'always', 'changes' (only when visual diffs detected), 'never' (silent mode)."
    required: false
    default: 'always'
  retention-days:
    description: "Duration in days for which images are stored in the branch."
    required: false
    default: '30'
outputs:
  passed-count:
    description: 'Number of images that matched the expected baseline.'
  failed-count:
    description: 'Number of images that differed from the expected baseline.'
  new-count:
    description: 'Number of images with no expected baseline.'
  deleted-count:
    description: 'Number of expected images missing from the actual set.'
  has-changed:
    description: 'true if any images failed, were added, or were deleted; otherwise false.'
  artifact-id:
    description: 'ID of the uploaded workflow artifact, if upload succeeded.'
runs:
  using: "node24"
  main: "lib/index.cjs"
